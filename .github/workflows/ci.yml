name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  rust:
    name: Rust core (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: rustc --version && cargo --version
      - name: cargo test
        run: cargo test --locked
      - name: cargo clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: cargo check (aarch64-apple-ios)
        run: cargo check --locked --lib --target aarch64-apple-ios
      - name: cargo check (aarch64-apple-ios-sim)
        run: cargo check --locked --lib --target aarch64-apple-ios-sim

  ios:
    name: iOS app (Xcode)
    # Newest macOS image (macOS 27); it is the only one with the iOS 27 SDK.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          rustc --version
      - name: Build GraffixCore.xcframework + Swift bindings
        run: ./scripts/build-xcframework.sh
      - name: Committed Swift bindings are up to date
        run: git diff --exit-code -- Graffix-AR/Generated
      - name: xcodebuild (generic iOS device)
        run: |
          xcodebuild build \
            -project Graffix-AR.xcodeproj -scheme Graffix-AR \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData-device \
            CODE_SIGNING_ALLOWED=NO
      - name: xcodebuild (generic iOS Simulator)
        run: |
          xcodebuild build \
            -project Graffix-AR.xcodeproj -scheme Graffix-AR \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData-sim \
            CODE_SIGNING_ALLOWED=NO
      - name: Pick an iOS 27 iPhone simulator
        id: sim
        run: |
          xcrun simctl list runtimes
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          found = []
          for runtime, entries in devices.items():
              m = re.search(r"iOS-27-(\d+)", runtime)
              if not m:
                  continue
              for d in entries:
                  if d["name"].startswith("iPhone"):
                      found.append((int(m.group(1)), d["name"], d["udid"]))
          if not found:
              sys.exit("no available iOS 27 iPhone simulator")
          found.sort(reverse=True)
          print(found[0][1], "/ iOS 27.%d" % found[0][0], file=sys.stderr)
          print(found[0][2])
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: UI tests (works detail, iOS 27 Simulator)
        run: |
          xcodebuild test \
            -project Graffix-AR.xcodeproj -scheme Graffix-AR \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData-uitest \
            -resultBundlePath build/UITests.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload UI test results (.xcresult)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: UITests-xcresult
          path: build/UITests.xcresult
          if-no-files-found: warn
